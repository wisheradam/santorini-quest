<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Create, print, and share your own Santorini-inspired quests."
    />
    <title>Santorini Quest</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #f7f1e8;
        color: #17324d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 15%, rgba(255,255,255,.95), transparent 28rem),
          linear-gradient(145deg, #f8f1e7 0%, #d9edf3 100%);
      }

      main {
        width: min(760px, calc(100% - 2rem));
        padding: clamp(2rem, 7vw, 5rem);
        text-align: center;
        background: rgba(255,255,255,.76);
        border: 1px solid rgba(18,108,142,.14);
        border-radius: 2rem;
        box-shadow: 0 24px 80px rgba(23,50,77,.12);
        backdrop-filter: blur(16px);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #ba6b3d;
        font-weight: 750;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #126c8e;
        font-family: Georgia, serif;
        font-size: clamp(3rem, 10vw, 6.5rem);
        font-weight: 500;
        line-height: .9;
      }

      p {
        max-width: 38rem;
        margin: 1.75rem auto 0;
        font-size: clamp(1rem, 2.4vw, 1.25rem);
        line-height: 1.7;
      }

      .features {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: .65rem;
        margin-top: 2rem;
      }

      .features span {
        padding: .65rem 1rem;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 5px 18px rgba(23,50,77,.08);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Your adventure is taking shape</p>
      <h1>Santorini Quest</h1>
      <p>
        Create a personal quest, print it or save it as an image, and share a
        countdown for the adventure ahead.
      </p>
      <div class="features" aria-label="Planned features">
        <span>Create</span>
        <span>Print</span>
        <span>Save</span>
        <span>Count down</span>
      </div>
    </main>
  </body>
</html>
