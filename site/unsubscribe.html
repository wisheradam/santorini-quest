<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unsubscribe — Santorini.quest</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f9fc;color:#191c1f;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(520px,calc(100% - 32px));padding:36px;box-sizing:border-box;background:#fff;border-radius:24px;box-shadow:0 20px 60px #00234914}h1{color:#002349}.button{width:100%;min-height:52px;border:0;border-radius:12px;background:#0038ff;color:#fff;font-weight:800;cursor:pointer}#status{min-height:24px}</style></head><body><main class="card"><h1>Unsubscribe</h1><p>Stop promotional emails from Santorini.quest. Transactional itinerary emails you request are not affected.</p><button class="button" id="unsubscribe" type="button">Confirm unsubscribe</button><p id="status" role="status"></p></main><script>document.querySelector('#unsubscribe').onclick=async e=>{const token=new URLSearchParams(location.search).get('token');if(!token)return document.querySelector('#status').textContent='This unsubscribe link is invalid.';e.currentTarget.disabled=true;try{const r=await fetch('https://pbvoeysg9a.execute-api.us-east-1.amazonaws.com/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})});if(!r.ok)throw 0;document.querySelector('#status').textContent='You have been unsubscribed.'}catch{document.querySelector('#status').textContent='We could not update your subscription. Please try again.'}finally{e.currentTarget.disabled=false}};</script></body></html>
