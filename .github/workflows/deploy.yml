name: Deploy production website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://santorini.quest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::533267008693:role/SantoriniQuestGitHubDeploy
          aws-region: us-east-1
          role-session-name: santorini-quest-deploy
          allowed-account-ids: "533267008693"

      - name: Upload website
        run: >
          aws s3 sync site/ s3://santorini-quest-web-533267008693/
          --delete
          --cache-control "public,max-age=3600"

      - name: Keep the HTML entry point fresh
        run: >
          aws s3 cp site/index.html
          s3://santorini-quest-web-533267008693/index.html
          --content-type "text/html; charset=utf-8"
          --cache-control "no-cache"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id E227EMMF9K7JWN --paths "/*"
